[metadata]
name = neuralviz
version = 0.1.0
description = Pure Python visualization package for neural codes and neural ideals
license = MIT

[options]
packages = find:
python_requires = >=3.8
install_requires =
    matplotlib>=3.5
    networkx>=2.6
    numpy>=1.21

[options.packages.find]
include = neuralviz*

[options.extras_require]
interactive = plotly>=5.0
convex2d = shapely>=2.0; scipy>=1.10
all = plotly>=5.0; shapely>=2.0; scipy>=1.10
dev = pytest>=7.0; plotly>=5.0; shapely>=2.0; scipy>=1.10
